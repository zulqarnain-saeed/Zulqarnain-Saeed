<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <!-- Background -->
  <rect width="1200" height="630" fill="#020617"/>
  
  <!-- Subtle Gradients -->
  <circle cx="1050" cy="150" r="350" fill="#0d9488" fill-opacity="0.12" filter="blur(80px)"/>
  <circle cx="150" cy="500" r="300" fill="#14b8a6" fill-opacity="0.08" filter="blur(80px)"/>
  
  <!-- Grid Dots pattern -->
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.5" fill="#14b8a6" fill-opacity="0.12"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Outer Card Frame -->
  <rect x="60" y="60" width="1080" height="510" rx="24" stroke="#1e293b" stroke-width="2" fill="#0f172a" fill-opacity="0.6"/>

  <!-- Top Accent Stripe -->
  <rect x="60" y="60" width="1080" height="6" rx="3" fill="#0d9488"/>

  <!-- Monogram Icon -->
  <rect x="120" y="120" width="80" height="80" rx="20" fill="#0d9488"/>
  <text x="160" y="172" fill="#ffffff" font-family="'Space Grotesk', system-ui, sans-serif" font-size="34" font-weight="700" text-anchor="middle">ZS</text>

  <!-- Status Pill -->
  <rect x="220" y="136" width="360" height="36" rx="18" fill="#14b8a6" fill-opacity="0.15" stroke="#14b8a6" stroke-opacity="0.3" stroke-width="1"/>
  <circle cx="240" cy="154" r="5" fill="#10b981"/>
  <text x="255" y="160" fill="#5eead4" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="500">BS CS @ UCP Lahore · Year 2024–2028</text>

  <!-- Name -->
  <text x="120" y="270" fill="#ffffff" font-family="'Space Grotesk', system-ui, sans-serif" font-size="64" font-weight="700" letter-spacing="-1">Zulqarnain Saeed</text>

  <!-- Tagline / Subtitle -->
  <text x="120" y="325" fill="#2dd4bf" font-family="'Space Grotesk', system-ui, sans-serif" font-size="28" font-weight="500">CS Student, Systems Explorer &amp; Founder of Zentorix</text>

  <!-- Description -->
  <text x="120" y="380" fill="#94a3b8" font-family="'Inter', system-ui, sans-serif" font-size="20" font-weight="400">
    Building software systems, exploring algorithms and OS internals, and delivering web applications.
  </text>
  <text x="120" y="412" fill="#94a3b8" font-family="'Inter', system-ui, sans-serif" font-size="20" font-weight="400">
    Exploring DevOps &amp; DevSecOps. Open to software engineering internships and collaborations.
  </text>

  <!-- Pills Row -->
  <g transform="translate(120, 470)">
    <rect x="0" y="0" width="120" height="36" rx="8" fill="#1e293b"/>
    <text x="60" y="23" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="14" text-anchor="middle">C / C++</text>

    <rect x="135" y="0" width="110" height="36" rx="8" fill="#1e293b"/>
    <text x="190" y="23" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="14" text-anchor="middle">Python</text>

    <rect x="260" y="0" width="140" height="36" rx="8" fill="#1e293b"/>
    <text x="330" y="23" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="14" text-anchor="middle">Algorithms</text>

    <rect x="415" y="0" width="170" height="36" rx="8" fill="#1e293b"/>
    <text x="500" y="23" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="14" text-anchor="middle">React &amp; Next.js</text>

    <rect x="600" y="0" width="150" height="36" rx="8" fill="#1e293b"/>
    <text x="675" y="23" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="14" text-anchor="middle">DevOps Study</text>
  </g>

  <!-- Domain / URL watermark -->
  <text x="1060" y="493" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="16" text-anchor="end">zulqarnain-saeed.netlify.app</text>
</svg>
